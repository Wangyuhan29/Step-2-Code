[deepseek]
# DeepSeek API 密钥，从 https://platform.deepseek.com 获取
api_key = your_deepseek_api_key_here
# DeepSeek API 基础 URL（默认不需要修改）
base_url = https://api.deepseek.com
# 使用的模型名称
model = deepseek-chat

[mysql]
host = localhost
port = 3306
user = root
password = your_mysql_password
database = github_rust_data

[processor]
# 允许的语言列表（逗号分隔，使用 langdetect 语言代码）
# 例如：en（英语）、zh-cn（中文简体）、zh-tw（中文繁体）
allowed_languages = en,zh-cn,zh-tw
# 最小文本长度（过滤掉过短的文本）
min_text_length = 10
# 去重策略：exact（完全匹配）或 fuzzy（模糊匹配，基于哈希）
dedup_strategy = exact
# 是否将处理后的数据写回数据库
save_to_db = true

[sentiment]
# 每批次处理的文本数量
batch_size = 10
# API 请求之间的延迟（秒），避免速率限制
request_delay = 1.0
# 最大重试次数
max_retries = 3
